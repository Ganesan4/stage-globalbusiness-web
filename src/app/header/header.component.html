<nav class="top-0 w-full z-50 bg-white shadow-sm">
  <!-- <div class="container mx-auto px-4 lg:px-0"> -->
  <div class="max-w-7xl mx-auto px-6">
    <!-- Desktop Header -->
    <div class="hidden lg:flex justify-between items-center py-4">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a routerLink="/">
          <img class="h-12 w-auto" src="assets/img/logo.png" alt="Logo" />
        </a>
      </div>

      <!-- Navigation Links -->
      <!-- Desktop Links -->
      <div class="flex items-center space-x-4">
        <a href="javascript:void(0)" (click)="scrollTo('search-bar')"
          class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 lg:ml-6 ml-0">
          Home
        </a>
        <a href="javascript:void(0)" (click)="scrollTo('why-choose-us')"
          class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 lg:ml-6 ml-0">
          Why Choose Us
        </a>
        <a href="javascript:void(0)" (click)="scrollTo('benefits')"
          class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 lg:ml-6 ml-0">
          Benefits
        </a>
        <a href="javascript:void(0)" (click)="scrollTo('testimonials')"
          class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 lg:ml-6 ml-0">
          Testimonials
        </a>
        <a href="javascript:void(0)" (click)="scrollTo('how-it-works')"
          class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 lg:ml-6 ml-0">
          How It Works
        </a>
      </div>


      <!-- CTA Button -->
      <div class="flex items-center space-x-4">
        <a *ngIf="!isLoggedIn" 
          (click)="forceReload()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors duration-200 shadow-md flex items-center gap-2">
          Add Your Business
          <i class="fa-solid fa-arrow-right"></i>
        </a>

        <div id="desktop-menu" class="ml-4"></div>

        <!-- User Account when logged in -->
        <div class="flex items-center space-x-4" *ngIf="isLoggedIn">
          <a [routerLink]="getMyAccountLink()"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200 flex items-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
            <span>{{ getMyAccountText() }}</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Mobile Header -->
    <div class="lg:hidden">
      <div class="flex justify-between items-center py-4">
        <!-- Logo -->
        <a routerLink="/">
          <img class="h-8 w-auto" src="assets/img/logo.png" alt="Logo" />
        </a>

        <!-- Mobile Menu Button -->
        <button class="p-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors duration-200"
          (click)="toggleMenu()" aria-label="Toggle menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <!-- Mobile Menu Items -->
      <div *ngIf="isMenuOpen" class="py-4 border-t border-gray-200 bg-white">
        <div class="flex flex-col space-y-4">
          <!-- Navigation Links -->
          <a href="javascript:void(0)" (click)="scrollTo('search-bar')"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">
            Home
          </a>
          <a href="javascript:void(0)" (click)="scrollTo('why-choose-us')"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">
            Why Choose Us
          </a>
          <a href="javascript:void(0)" (click)="scrollTo('benefits')"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">
            Benefits
          </a>
          <a href="javascript:void(0)" (click)="scrollTo('testimonials')"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">
            Testimonials
          </a>
          <a href="javascript:void(0)" (click)="scrollTo('how-it-works')"
            class="text-gray-700 hover:text-blue-600 font-medium transition-colors duration-200">
            How It Works
          </a>

          <!-- CTA Button -->
          <div id="mobile-menu" class="mt-4"></div>
          <a (click)="forceReload(); toggleMenu()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-medium text-center transition-colors duration-200 shadow-md mt-4">
            Add Your Business
          </a>

          <!-- User Account when logged in -->
          <div class="pt-4 border-t border-gray-200" *ngIf="isLoggedIn">
            <a [routerLink]="getMyAccountLink()"
              class="text-gray-700 hover:text-blue-600 font-medium flex items-center justify-center space-x-2 transition-colors duration-200"
              (click)="toggleMenu()">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
              <span>{{ getMyAccountText() }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
