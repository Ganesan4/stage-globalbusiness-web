<!-- Popup Box -->
<div *ngIf="isOpen"
  class="fixed bottom-6 left-6 w-80 bg-white rounded-2xl shadow-2xl border border-gray-200 p-4 z-50 animate-fade-in">
  <!-- Header -->
  <div class="flex justify-between items-center mb-3">
    <h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
      <span class="text-blue-600 text-xl">
        🛒
      </span>
      Recent Business Users
    </h3>

    <button (click)="closePopup()" class="text-gray-500 hover:text-red-500 transition text-xl leading-none">
      ✖
    </button>
  </div>

  <!-- ⭐ New Top Highlight Text -->
  <p class="text-sm text-gray-700 mb-3">
    🔥 Businesses Are Joining In!
  </p>

  <!-- Sales List -->
  <div class="space-y-3">
    <div *ngFor="let sale of recentSales"
      class="flex items-start gap-3 bg-gray-50 p-3 rounded-lg shadow-sm hover:shadow-md transition">
      <div class="w-10 h-10 text-blue-600 rounded-full flex items-center justify-center text-lg">
        🛒
      </div>

      <p class="text-sm text-gray-700 leading-tight">
        {{ sale }}
      </p>
    </div>
  </div>
  <!-- ⭐ New Bottom Sentence -->
  <p class="text-sm text-gray-700 font-medium mt-4">
    → Join them and get yours now!
  </p>
</div>

<!-- Floating Icon -->
<div *ngIf="!isOpen" (click)="openPopup()"
  class="fixed bottom-6 left-6 bg-blue-600 text-white p-4 rounded-full shadow-xl cursor-pointer z-50 animate-bounce">
  🔔
</div>
