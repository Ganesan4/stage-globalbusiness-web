<div class="gap-4 justify-center mt-2">
  <div class="col-span-12 md:col-span-6 flex flex-col items-center centerscreen">
    <div class="w-full max-w-md p-6 border border-gray-300 rounded-lg shadow-lg bg-white"> 
     <div class="flex justify-center items-center h-full">
      <h2 class="text-2xl text-left text-gray-800 mb-6">Login to your account</h2>
    </div>  
      <div *ngIf="errorMessage" class="text-red-500 mb-4 text-center">
        {{ errorMessage }}
      </div>

      <div *ngIf="showMessage" class="p-2 text-center" [ngClass]="{'text-red-500': messageType === 'error', 'text-green-500': messageType === 'success'}">
        {{ message }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="email" class="block text-gray-700 font-medium mb-2">Email:</label>
          <input
            formControlName="email"
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          />
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-500 text-sm">
            Email is required and must be valid.
          </div>
        </div>
        
        <div class="mb-4">
          <label for="password" class="block text-gray-700 font-medium mb-2">Password:</label>
          <input
            formControlName="password"
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          />
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-sm">
            Password is required.
          </div>
        </div>

        <div class="mb-4">
          <label class="inline-flex items-center">
            <input type="checkbox" class="form-checkbox text-blue-600" />
            <span class="ml-2 text-gray-700">Remember me</span>
          </label>
        </div>

        <div class="flex justify-center items-center h-full">
          <button
            type="submit"
            class="border border-blue-500  w-full text-white py-2 px-4 rounded bg-blue-500 hover:bg-blue-600 hover:text-white">
            Submit
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>
