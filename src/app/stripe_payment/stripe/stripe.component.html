<!-- ✅ SUCCESS / ERROR VIEW -->
<div *ngIf="paymentStatus !== 'idle'" class="text-center">

  <h3 class="text-lg font-bold mb-4">
 <!-- <div *ngIf="success.code == true" class="success-message">
    {{success.message}}
  </div> -->
    <span *ngIf="paymentStatus === 'success'" class="text-green-600">
      Payment Successful
    </span>

    <span *ngIf="paymentStatus === 'error'" class="text-red-500">
      Payment Failed
    </span>

  </h3>

  <div class="font-semibold mb-4">
    {{ paymentMessage }}
  </div>

  <button
    (click)="onClose()"
    class="mt-4 bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
    Close
  </button>

</div>


<!-- ✅ PAYMENT FORM (ONLY BEFORE PAYMENT) -->
<div *ngIf="paymentStatus === 'idle'">

   <h3 class="text-lg font-bold mb-4 text-center">Pay with Stripe</h3>

  <ngx-stripe-card-group
    [formGroup]="stripeTest"
    [elementsOptions]="elementsOptions"
    class="card-group-container">

    <ngx-stripe-card-number
      [options]="cardOptions"
      class="stripe-input">
    </ngx-stripe-card-number>

    <ngx-stripe-card-expiry
      [options]="cardOptions"
      class="stripe-input">
    </ngx-stripe-card-expiry>

    <ngx-stripe-card-cvc
      [options]="cardOptions"
      class="stripe-input">
    </ngx-stripe-card-cvc>

  </ngx-stripe-card-group>

  <p *ngIf="error.message" class="error-message text-center text-sm font-semibold mb-3 px-2">
    {{ error.message }}
  </p>

  <div class="flex justify-center gap-4 mt-4">

  <!-- CANCEL BUTTON -->
  <button
    type="button"
    (click)="onCancel()"
    class="px-6 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">

    Cancel

  </button>

  <!-- PAY NOW BUTTON -->
  <button
    type="submit"
    (click)="pay()"
    [disabled]="isProcessing"
    class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 disabled:opacity-60">

    {{ isProcessing ? 'Processing...' : 'Pay Now' }}

  </button>

</div>

</div>
