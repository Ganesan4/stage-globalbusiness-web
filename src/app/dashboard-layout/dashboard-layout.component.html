<div class="w-full">

<div *ngIf="!isSidebarOpen">

class="text-white bg-blue-700 mt-4 ml-4 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium text-sm lg:px-5 lg:py-2.5 md:px-2 md:py-1 px-2 py-1 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
type="button"
data-drawer-target="drawer-navigation"
data-drawer-show="drawer-navigation"
aria-controls="drawer-navigation"

>
<svg
  class="w-6 h-6 text-white"
  fill="none"
  stroke="currentColor"
  viewBox="0 0 24 24"
  xmlns="http://www.w3.org/2000/svg"
>

    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    d="M4 6h16M4 12h16M4 18h16"

</svg>
</button>

</div>

          <router-outlet></router-outlet>

<div *ngIf="isModalOpen" id="static-modal" data-modal-backdrop="static" tabindex="-1" aria-hidden="true" 
class="fixed top-0 right-0 left-0 z-50 flex justify-center items-center w-full h-full overflow-y-auto overflow-x-hidden bg-black bg-opacity-50 md:inset-0"
>
<div class="relative p-4 w-full max-w-2xl max-h-full">
  <!-- Modal content -->
  <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
    <!-- Modal header -->
    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
        Set Schedule
      </h3>
      <button
        type="button"
        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
        (click)="closeModal()"
      >
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
          />
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    <!-- Modal body -->
    <div class="p-4 md:p-5 space-y-4">
      <p class="text-base leading-relaxed text-gray-500 dark:text-gray-400">
        Choose the days for which you want the modal to be displayed:
      </p>
      <div class="grid grid-cols-2 gap-2">
        <label *ngFor="let day of days" class="inline-flex items-center">
          <input
            type="radio"
            [value]="day"
            [checked]="alreadyset.includes(day)"
            (change)="toggleDay(day)"
            class="form-checkbox text-blue-600 rounded focus:ring-blue-500"
          />
          <span class="ml-2 text-gray-900 dark:text-gray-300">{{ day }}</span>
        </label>
      </div>
    </div>
    <!-- Modal footer -->
    <div class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
      <button
        type="button"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
        (click)="setSchedule()"
      >
        OK
      </button>
      <button
        type="button"
        class="py-2.5 px-5 ms-3 text-sm font-medium bg-gray-500 focus:outline-none rounded-lg border border-gray-200 hover:bg-gray-600 text-white "
        (click)="closeModal()"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
</div>
