<div class="flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 pb-12 pt-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-2xl overflow-hidden">
      
      <div class="bg-blue-600 px-8 py-8 text-center">
        <!-- <div class="flex justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path d="M8 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM15 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
            <path d="M3 4a1 1 0 00-1 1v10a1 1 0 001 1h1.05a2.5 2.5 0 014.9 0H10a1 1 0 001-1V5a1 1 0 00-1-1H3zM14 7a1 1 0 00-1 1v6.05A2.5 2.5 0 0015.95 16H17a1 1 0 001-1v-5a1 1 0 00-.293-.707l-2-2A1 1 0 0015 7h-1z" />
          </svg>
        </div> -->
        <h1 class="text-3xl font-bold text-white mb-2">Forgot Password?</h1>
        <p class="text-blue-100 text-sm">Enter your email to receive a password reset link</p>
      </div>

      
      <div class="px-8 py-8">
        
        <div *ngIf="message && !isError" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <div>
              <p class="font-semibold text-green-800">Check your email!</p>
              <p class="text-sm text-green-700 mt-1">{{ message }}</p>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="message && isError" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-600 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
            <div>
              <p class="font-semibold text-red-800">Error</p>
              <p class="text-sm text-red-700 mt-1">{{ message }}</p>
            </div>
          </div>
        </div>

        
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!message || isError" class="space-y-6">
          
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
            <div class="relative">
              <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
              <input
                type="email"
                id="email"
                formControlName="email"
                placeholder="you@example.com"
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
                [class.border-red-500]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
              />
            </div>
            <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.errors" class="mt-2">
              <p *ngIf="forgotForm.get('email')?.errors?.['required']" class="text-sm text-red-600">Email is required</p>
              <p *ngIf="forgotForm.get('email')?.errors?.['email']" class="text-sm text-red-600">Please enter a valid email address</p>
            </div>
          </div>

          
          <button
            type="submit"
            [disabled]="isLoading || forgotForm.invalid"
            class="w-full py-2 px-4 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2"
          >
            <span *ngIf="!isLoading">Send Reset Link</span>
            <span *ngIf="isLoading" class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Sending...
            </span>
          </button>
        </form>

        
        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Remembered your password?
            <a routerLink="/login" class="text-blue-600 font-semibold hover:text-blue-700 hover:underline">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
